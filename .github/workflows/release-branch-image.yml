name: Build and Push Release Branch Image

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact stable release version (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Create version tag and GitHub Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - name: Checkout release branch and tags
        uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0
          fetch-tags: true

      - name: Determine stable version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
        run: |
          set -euo pipefail
          previous_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -n "$RELEASE_VERSION" ]]; then
            [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid stable release version: $RELEASE_VERSION" >&2
              exit 1
            }
            tag="$RELEASE_VERSION"
          elif [[ -z "$previous_tag" ]]; then
            tag=v0.0.1
          else
            IFS=. read -r major minor patch <<< "${previous_tag#v}"
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Version tag already exists: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-notes"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log --reverse --no-merges --format='- %s ([`%h`](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H))' "$PREVIOUS_TAG..$RELEASE_TAG" > "$RUNNER_TEMP/release-notes/changes.md"
            {
              echo "## What's Changed"
              echo
              cat "$RUNNER_TEMP/release-notes/changes.md"
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$RELEASE_TAG"
            } > "$RUNNER_TEMP/release-notes/release.md"
          else
            git log --reverse --no-merges --format='- %s ([`%h`](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H))' > "$RUNNER_TEMP/release-notes/release.md"
            {
              echo "## What's Changed"
              echo
              cat "$RUNNER_TEMP/release-notes/release.md"
            } > "$RUNNER_TEMP/release-notes/changes.md"
            mv "$RUNNER_TEMP/release-notes/changes.md" "$RUNNER_TEMP/release-notes/release.md"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          prerelease: false
          make_latest: true
          body_path: ${{ runner.temp }}/release-notes/release.md
          generate_release_notes: false

  build:
    name: Build linux-${{ matrix.goarch }} binary
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: release-image-linux-${{ matrix.goarch }}

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          go build -tags sonic -trimpath \
            -ldflags "-s -w \
              -X ccLoad/internal/version.Version=${RELEASE_VERSION} \
              -X ccLoad/internal/version.Commit=${GIT_COMMIT} \
              -X ccLoad/internal/version.BuiltBy=github-actions" \
            -o "dist/ccload-linux-${GOARCH}" .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ccload-linux-${{ matrix.goarch }}
          path: dist/ccload-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build and push multi-platform image
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ccload-linux-*
          path: dist
          merge-multiple: true

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:release
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.tag }}
            ${{ steps.image.outputs.name }}:release-${{ github.sha }}
          cache-from: type=gha,scope=release-branch-image
          cache-to: type=gha,scope=release-branch-image,mode=max
