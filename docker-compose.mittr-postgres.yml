name: mittr-postgres

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MITTR_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${MITTR_POSTGRES_DB:-mittr}
      POSTGRES_USER: ${MITTR_POSTGRES_USER:-mittr}
      POSTGRES_PASSWORD: ${MITTR_POSTGRES_PASSWORD:?Set MITTR_POSTGRES_PASSWORD to a strong database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
